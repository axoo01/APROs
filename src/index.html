<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>APROs · Apprenticeship Program Operations</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="APROs — cohort operations, daily coaching and attendance for apprenticeship programs." />
    <meta name="theme-color" content="#08283b" />
    <link rel="icon" type="image/svg+xml" href="brand/logo-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var pref = localStorage.getItem('apros.theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <ap-root></ap-root>
  </body>
</html>
