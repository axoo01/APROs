<div class="relative isolate mx-auto max-w-7xl">
<!-- Frosted capsule is a sibling, not an ancestor, so menus/sheets can blur the page and use position:fixed. -->
<div class="glass absolute inset-0 -z-10 rounded-2xl border" aria-hidden="true"></div>
<div class="flex h-16 items-center gap-2 px-3 sm:px-4 lg:h-[4.5rem] lg:px-5">
  <span class="grid size-9 shrink-0 place-items-center rounded-xl bg-primary-500 lg:hidden" aria-hidden="true">
    <ap-logo variant="mark" [size]="16" />
  </span>

  <ap-cohort-switcher class="min-w-0 flex-1 lg:flex-none" />

  <div class="ml-auto flex items-center gap-1 sm:gap-3">
    <time
      class="hidden whitespace-nowrap rounded-full bg-surface-2 px-3 py-1.5 text-xs font-medium text-fg-muted md:block"
      [attr.datetime]="clock.today()"
    >
      {{ clock.today() | date: 'EEEE, d MMM y' }}
    </time>
    <ap-user-menu />
  </div>
</div>

@if (ctx.activePhase(); as phase) {
  <div class="flex items-center gap-2 px-4 pb-2 sm:hidden">
    <ap-phase-pill [phase]="phase" />
    <span class="text-xs text-fg-subtle">{{ clock.today() | date: 'EEE, d MMM' }}</span>
  </div>
}
</div>
