<div class="relative" (apClickOutside)="close()" [apClickOutsideEnabled]="open()">
  <button
    #trigger
    type="button"
    class="flex min-h-11 max-w-full items-center gap-3 rounded-xl px-2.5 py-1.5 text-left transition-colors hover:bg-surface-2"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    aria-controls="cohort-listbox"
    (click)="toggle()"
    (keydown)="onTriggerKey($event)"
  >
    <span class="min-w-0">
      <span class="block text-[11px] font-medium uppercase tracking-wider text-fg-subtle">Cohort</span>
      <span class="block truncate font-display text-[15px] font-semibold leading-tight">
        {{ ctx.activeCohort()?.displayName ?? 'No cohort' }}
      </span>
    </span>
    @if (ctx.activePhase(); as phase) {
      <span class="hidden sm:inline-flex"><ap-phase-pill [phase]="phase" /></span>
    }
    <ap-icon name="chevron-down" [size]="16" class="text-fg-subtle transition-transform" [class.rotate-180]="open()" />
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-40 bg-primary-900/40 backdrop-blur-[2px] sm:hidden" aria-hidden="true"></div>
    <div
      class="glass fixed inset-x-0 bottom-0 z-50 rounded-t-3xl border p-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] shadow-[var(--shadow-float)] [animation:sheet-in_260ms_var(--ease-out-quart)] sm:absolute sm:inset-x-auto sm:bottom-auto sm:left-0 sm:top-full sm:mt-2 sm:w-[26rem] sm:rounded-2xl sm:pb-2 sm:[animation:menu-in_160ms_var(--ease-out-quart)]"
    >
      <div class="mx-auto mb-2 mt-1 h-1 w-10 rounded-full bg-line sm:hidden" aria-hidden="true"></div>
      <p class="px-3 pb-2 pt-1 text-xs font-semibold uppercase tracking-wider text-fg-subtle" id="cohort-listbox-label">
        Switch cohort
      </p>
      <ul
        #listbox
        id="cohort-listbox"
        role="listbox"
        tabindex="-1"
        aria-labelledby="cohort-listbox-label"
        [attr.aria-activedescendant]="activeOptionId()"
        class="max-h-[60dvh] overflow-y-auto outline-none"
        (keydown)="onListKey($event)"
      >
        @for (c of ctx.cohorts(); track c.id; let i = $index) {
          <!-- Options use aria-activedescendant: keyboard is handled on the focused listbox, so options stay non-focusable. -->
          <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
          <li
            [id]="'cohort-opt-' + c.id"
            role="option"
            [attr.aria-selected]="c.id === ctx.activeCohort()?.id"
            class="flex min-h-12 cursor-pointer items-center gap-3 rounded-xl px-3 py-2 transition-colors hover:bg-surface-2"
            [class.bg-surface-2]="i === activeIndex()"
            (click)="choose(c)"
            (pointerenter)="activeIndex.set(i)"
          >
            <span class="min-w-0 flex-1">
              <span class="block truncate text-sm font-semibold">{{ c.displayName }}</span>
              <span class="block text-xs tabular-nums text-fg-subtle">
                {{ c.phase1StartDate | date: 'd MMM y' }} – {{ c.phase2EndDate | date: 'd MMM y' }}
              </span>
            </span>
            <ap-phase-pill [phase]="ctx.phaseOf(c)" />
            <ap-icon
              name="check"
              [size]="16"
              class="text-accent"
              [class.invisible]="c.id !== ctx.activeCohort()?.id"
            />
          </li>
        }
      </ul>
    </div>
  }
</div>
