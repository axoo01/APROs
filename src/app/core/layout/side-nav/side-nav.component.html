<div class="side-panel flex h-full w-full flex-col overflow-hidden rounded-[1.75rem]">
<div class="flex h-20 items-center gap-3 px-6">
  <ap-logo [size]="17" class="text-white" />
</div>
<p class="px-6 pb-4 text-[11px] font-semibold uppercase tracking-[0.18em] text-primary-200">
  Apprenticeship Ops
</p>

<nav aria-label="Primary" class="flex-1 px-3">
  <ul class="space-y-1">
    @for (item of nav.items(); track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          class="group relative isolate flex h-11 items-center gap-3 rounded-xl px-3 text-sm font-medium text-primary-100 transition-colors hover:bg-white/5 hover:text-white [&.is-active]:text-white"
        >
          <!-- Liquid pill: glides to the new item on navigation (view-transition-name set only while active). -->
          <span class="nav-pill absolute inset-0 -z-10 rounded-xl opacity-0 group-[.is-active]:opacity-100" aria-hidden="true">
            <span class="absolute inset-y-2.5 left-0 w-1 rounded-full bg-orange-500 shadow-[0_0_12px_rgb(255_90_0/0.8)]"></span>
          </span>
          <ap-icon [name]="item.icon" [size]="19" />
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>

@if (config.demoMode) {
  <div class="m-4 rounded-2xl bg-white/5 p-4 text-xs text-primary-100 ring-1 ring-white/10">
    <p class="flex items-center gap-2 font-semibold text-white">
      <span class="size-2 rounded-full bg-orange-500"></span> Demo mode
    </p>
    <p class="mt-1 leading-relaxed">Data lives in this browser. Reset anytime from your profile menu.</p>
  </div>
}
</div>
