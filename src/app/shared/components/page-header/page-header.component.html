<div class="min-w-0">
  @if (eyebrow()) {
    <p class="text-xs font-semibold uppercase tracking-[0.16em] text-accent">{{ eyebrow() }}</p>
  }
  <h1 class="mt-1 text-2xl font-semibold leading-tight sm:text-[1.75rem]">{{ title() }}</h1>
  @if (subtitle()) {
    <p class="mt-1 text-sm text-fg-muted">{{ subtitle() }}</p>
  }
</div>
<div class="flex shrink-0 items-center gap-2"><ng-content /></div>
