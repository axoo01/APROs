<div class="glass mx-auto flex max-w-3xl items-center gap-3 rounded-full border p-1.5 sm:pl-6">
  <p class="hidden min-w-0 flex-1 text-sm sm:block">
    <span class="font-semibold tabular-nums">{{ remaining() }}</span>
    <span class="text-fg-muted"> of {{ total() }} still {{ pendingLabel() }} — close out when you're done sweeping.</span>
  </p>
  <button
    type="button"
    class="btn btn-primary min-h-12 flex-1 rounded-full px-5 sm:flex-none"
    [disabled]="disabled()"
    (click)="closeout.emit()"
  >
    <ap-icon [name]="icon()" [size]="18" />
    Mark Remaining ({{ remaining() }}) as {{ outcome() }}
  </button>
</div>
