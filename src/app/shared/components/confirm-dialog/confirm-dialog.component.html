<dialog
  #dialog
  class="m-0 mt-auto w-full max-w-none rounded-t-3xl border border-line bg-surface p-0 text-fg shadow-[var(--shadow-float)] backdrop:bg-primary-900/50 backdrop:backdrop-blur-sm sm:m-auto sm:max-w-md sm:rounded-3xl"
  [attr.aria-labelledby]="titleId"
  (close)="open.set(false)"
  (cancel)="cancelled.emit()"
>
  <form method="dialog" class="flex flex-col gap-5 p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))] sm:pb-6">
    <div class="space-y-2">
      <h2 [id]="titleId" class="text-lg font-semibold">{{ title() }}</h2>
      <p class="text-sm text-fg-muted"><ng-content /></p>
    </div>
    <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button type="submit" value="cancel" class="btn btn-secondary" (click)="cancelled.emit()">
        {{ cancelLabel() }}
      </button>
      <button
        type="submit"
        value="confirm"
        class="btn"
        [class.btn-danger]="tone() === 'danger'"
        [class.btn-primary]="tone() !== 'danger'"
        (click)="confirmed.emit()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </form>
</dialog>
