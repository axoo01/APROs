@if (variant() === 'mark') {
  <svg viewBox="0 0 36 34" [attr.height]="size()" role="img" aria-label="AmaliTech">
    <path fill="var(--color-orange-500)" [attr.d]="bars" transform="translate(-268.93 -1.18)" />
  </svg>
} @else {
  <svg viewBox="0 0 400 36" [attr.height]="size()" role="img" aria-label="AmaliTech">
    <path fill="currentColor" [attr.d]="letters" />
    <path fill="var(--color-orange-500)" [attr.d]="bars" />
  </svg>
}
