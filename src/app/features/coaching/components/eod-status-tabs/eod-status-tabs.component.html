<div role="tablist" aria-label="EOD status" class="relative grid grid-cols-4 gap-[var(--gap)]">
  <span
    class="lens tab-lens pointer-events-none absolute inset-y-0 left-0 rounded-xl"
    [style.--n]="count"
    [style.--i]="activeIndex()"
    [style.--lens-tone]="activeTone()"
    aria-hidden="true"
  ></span>
  @for (t of tabs(); track t.key) {
    <button
      type="button"
      role="tab"
      [id]="tabId(t.key)"
      [attr.aria-selected]="active() === t.key"
      [attr.aria-controls]="panelId()"
      [tabindex]="active() === t.key ? 0 : -1"
      class="flex min-h-[4.5rem] flex-col items-start justify-between relative rounded-xl px-2.5 py-2.5 text-left transition-[background-color,color,transform] duration-200 active:scale-[0.98] sm:px-4"
      [class]="active() === t.key ? 'text-fg' : 'text-fg-muted hover:bg-surface-2'"
      (click)="active.set(t.key)"
      (keydown)="onKey($event)"
    >
      <span class="flex w-full items-center gap-1.5 text-[11px] font-semibold leading-tight sm:text-xs">
        <span
          class="size-2 shrink-0 rounded-full"
          [class]="t.dot"
          aria-hidden="true"
        ></span>
        <span class="truncate sm:hidden">{{ t.short }}</span>
        <span class="hidden truncate sm:inline">{{ t.label }}</span>
      </span>
      <span class="font-display text-2xl font-semibold tabular-nums leading-none transition-colors sm:text-[1.75rem]" [class]="active() === t.key ? t.text : 'text-fg'">{{ t.count }}</span>
    </button>
  }
</div>
