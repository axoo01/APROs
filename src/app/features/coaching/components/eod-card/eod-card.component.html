<div
  class="card relative flex items-stretch overflow-hidden transition-[box-shadow,border-color,opacity,transform] duration-200 hover:-translate-y-0.5"
  [class.border-transparent]="entry().revealing"
  [class.ring-2]="entry().revealing"
  [class]="entry().revealing && tone() ? tone()!.ring + ' card-pop' : ''"
  [class.opacity-60]="muted() || disabled()"
>
  <span class="spec-glow pointer-events-none absolute inset-0" [style.--tone]="stripe()" aria-hidden="true"></span>

  <button
    type="button"
    data-sweep-card
    class="flex min-h-[4.25rem] min-w-0 flex-1 select-none items-center gap-2 py-2 pl-2.5 pr-0.5 text-left sm:gap-3 sm:py-2.5 sm:pl-4 sm:pr-1 transition-colors hover:bg-surface-2/50 active:bg-surface-2 disabled:cursor-not-allowed"
    apLongPress
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    aria-keyshortcuts="O S B N D"
    (apLongPress)="details.emit()"
    (click)="onClick($event)"
    (keydown)="onKey($event)"
  >
    <span class="relative shrink-0">
      <span class="block sm:hidden"><ap-avatar [name]="entry().name" [src]="entry().apprentice.avatarUrl" [size]="36" /></span>
      <span class="hidden sm:block"><ap-avatar [name]="entry().name" [src]="entry().apprentice.avatarUrl" [size]="44" /></span>
      @if (entry().revealing && tone(); as t) {
        <span
          class="badge-pop absolute -bottom-1 -right-1 grid size-5 place-items-center rounded-full ring-2 ring-surface"
          [class]="t.solid"
          aria-hidden="true"
        >
          <ap-icon name="check" [size]="12" [strokeWidth]="3" />
        </span>
      }
    </span>

    <span class="min-w-0 flex-1">
      <!-- Two lines before cutting, so first + last name stay readable in the 2-up phone grid. -->
      <span class="line-clamp-2 break-words text-sm font-semibold leading-tight sm:text-[0.9375rem] sm:leading-snug">{{ entry().name }}</span>
      <span class="mt-0.5 flex min-w-0 items-center gap-1 text-xs text-fg-muted">
        @if (flag(); as f) {
          <span
            class="inline-flex shrink-0 items-center gap-1 rounded-full bg-danger-soft px-1.5 py-px text-[10px] font-semibold leading-4 text-danger ring-1 ring-inset ring-danger/35"
            [title]="f.description"
            aria-hidden="true"
          >
            <ap-icon name="trending-down" [size]="10" [strokeWidth]="2.5" />{{ f.label }}
          </span>
        }
        @if (entry().mark?.note) {
          <ap-icon name="note" [size]="12" class="shrink-0" />
        }
        <span class="truncate">{{ subtitle() }}</span>
      </span>
    </span>

    @if (entry().mark; as mark) {
      <span
        class="grid h-7 min-w-7 shrink-0 place-items-center rounded-lg px-1 font-display text-xs font-semibold sm:h-8 sm:min-w-8 sm:px-1.5"
        [class]="entry().revealing ? tone()!.solid : tone()!.soft"
        aria-hidden="true"
        >{{ short[mark.status] }}</span
      >
    } @else if (muted() && entry().attendance) {
      <span class="grid size-8 shrink-0 place-items-center rounded-lg bg-surface-2 font-display text-xs font-semibold text-fg-muted" aria-hidden="true">
        {{ entry().attendance }}
      </span>
    }
  </button>

  <button
    type="button"
    class="grid w-8 shrink-0 place-items-center text-fg-subtle sm:w-11 transition-colors hover:bg-surface-2 hover:text-accent disabled:cursor-not-allowed"
    [disabled]="disabled()"
    [attr.aria-label]="'Add a note for ' + entry().name"
    title="Add note"
    (click)="note.emit()"
  >
    <ap-icon name="note" [size]="18" />
  </button>
  <button
    type="button"
    class="grid w-11 shrink-0 place-items-center text-fg-subtle transition-colors hover:bg-surface-2 hover:text-fg disabled:cursor-not-allowed"
    [disabled]="disabled()"
    [attr.aria-label]="'Status, tag and note for ' + entry().name"
    (click)="details.emit()"
  >
    <ap-icon name="more-horizontal" [size]="18" />
  </button>
</div>
