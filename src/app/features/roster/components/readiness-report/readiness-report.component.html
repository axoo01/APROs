<section id="readiness-report" class="card mt-3 p-4 sm:p-5" aria-label="Phase 2 readiness breakdown">
  <div class="grid gap-6 lg:grid-cols-2">
    @for (g of groups; track g.key) {
      @let list = rowsOf(g.key);
      <div class="min-w-0">
        <h3 class="flex items-center justify-between text-xs font-semibold uppercase tracking-wide" [class]="g.tone">
          {{ g.title }} <span class="tabular-nums">{{ list.length }}</span>
        </h3>
        <ul class="mt-2 divide-y divide-line">
          @for (r of list; track r.entry.id) {
            <li>
              <button
                type="button"
                class="flex w-full items-start gap-3 rounded-lg py-2.5 text-left transition-colors hover:bg-surface-2/60 focus-visible:bg-surface-2"
                (click)="openPassport.emit(r.entry.id)"
              >
                <ap-avatar [name]="r.entry.name" [src]="r.entry.apprentice.avatarUrl" [size]="32" />
                <span class="min-w-0 flex-1">
                  <span class="flex items-center gap-2">
                    <span class="truncate text-sm font-medium">{{ r.entry.name }}</span>
                    @if (r.entry.specialization; as s) {
                      <span class="inline-flex shrink-0 items-center gap-1 text-[10px] font-semibold text-fg-muted">
                        <span class="size-1.5 rounded-full" [style.background-color]="tag(s.colorTag)"></span>{{ s.code }}
                      </span>
                    }
                  </span>
                  <span class="mt-1 flex flex-wrap gap-1">
                    @for (d of r.drivers; track d) {
                      <span class="rounded-md bg-surface-2 px-1.5 py-0.5 text-[11px] text-fg-muted">{{ d }}</span>
                    }
                  </span>
                </span>
                <span class="shrink-0 rounded-full px-2 py-0.5 font-display text-sm font-semibold tabular-nums" [class]="g.chip">
                  {{ r.entry.health.score }}
                </span>
              </button>
            </li>
          } @empty {
            <li class="py-4 text-sm text-fg-muted">{{ g.key === 'pairing' ? 'Everyone in scope is ready. 🎉' : 'No one yet.' }}</li>
          }
        </ul>
      </div>
    }
  </div>
</section>
