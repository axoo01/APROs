<!-- Backdrop click closes (pointer convenience); Esc is the native keyboard path. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog #dialog class="sheet" aria-labelledby="sprint-dialog-title" (close)="closed.emit()" (click)="onBackdrop($event)">
  <form class="flex flex-col gap-4 p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] sm:p-6" novalidate (submit)="$event.preventDefault(); submit()">
    <span class="mx-auto -mt-2 h-1 w-10 rounded-full bg-line-strong/50 sm:hidden" aria-hidden="true"></span>
    <header class="flex items-center justify-between gap-3">
      <div>
        <h2 id="sprint-dialog-title" class="text-base font-semibold">Log Sprint Mark</h2>
        <p class="text-xs text-fg-muted">Admin only · saving an existing sprint updates it</p>
      </div>
      <button type="button" class="btn btn-ghost size-11 shrink-0 px-0" aria-label="Close" (click)="close()">
        <ap-icon name="x" [size]="18" />
      </button>
    </header>

    <label class="flex flex-col gap-1.5 text-sm font-medium">
      Apprentice
      <select class="field" required (change)="pickApprentice(value($event))">
        <option value="" [selected]="apprenticeId() === null">Select an apprentice…</option>
        @for (c of candidates(); track c.id) {
          <option [value]="c.id" [selected]="apprenticeId() === c.id">{{ c.name }}</option>
        }
      </select>
    </label>

    <div class="grid grid-cols-2 gap-3">
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Sprint
        <select class="field" [disabled]="!apprenticeId()" (change)="pickSprint(value($event))">
          @for (n of sprintNumbers; track n) {
            <option [value]="n" [selected]="sprintNumber() === n">Sprint {{ n }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1.5 text-sm font-medium">
        Score <span class="sr-only">out of {{ scoreMax }}</span>
        <input
          class="field tabular-nums"
          type="number"
          inputmode="numeric"
          min="0"
          [attr.max]="scoreMax"
          step="1"
          placeholder="0–100"
          [value]="score() ?? ''"
          (input)="setScore(value($event))"
        />
      </label>
    </div>

    @if (existing(); as m) {
      <p class="-mt-1 rounded-lg bg-info-soft px-3 py-2 text-xs text-info">
        Sprint {{ m.sprintNumber }} is already marked ({{ m.score }}). Saving replaces it.
      </p>
    }

    <label class="flex flex-col gap-1.5 text-sm font-medium">
      Project name
      <input
        class="field"
        type="text"
        [attr.maxlength]="projectMax"
        placeholder="e.g. Inventory REST API"
        [value]="projectName()"
        (input)="projectName.set(value($event))"
      />
    </label>

    <label class="flex flex-col gap-1.5 text-sm font-medium">
      Deliverable summary
      <textarea
        class="field min-h-24 resize-none py-2.5"
        [attr.maxlength]="summaryMax"
        placeholder="What was delivered, quality, what carried over…"
        [value]="summary()"
        (input)="summary.set(value($event))"
      ></textarea>
      <span class="self-end text-[11px] font-normal tabular-nums text-fg-subtle">{{ summary().length }}/{{ summaryMax }}</span>
    </label>

    @if (touched() && issues().length) {
      <ul class="rounded-lg bg-danger-soft px-3 py-2 text-xs text-danger" role="alert">
        @for (i of issues(); track i) {
          <li>{{ i }}</li>
        }
      </ul>
    }

    <div class="flex justify-end gap-2">
      <button type="button" class="btn btn-ghost h-11 px-4" (click)="close()">Cancel</button>
      <button type="submit" class="btn btn-primary h-11 px-5">Save mark</button>
    </div>
  </form>
</dialog>
