<ap-page-header
  eyebrow="Cohort health"
  title="Master Dashboard"
  [subtitle]="(f.cohort()?.displayName ?? '') + ' · ' + f.phaseLabel() + ' · cohort to date'"
>
  @if (f.specFilter(); as specId) {
    <button
      type="button"
      class="inline-flex min-h-11 items-center gap-2 rounded-full bg-accent-soft px-4 text-sm font-semibold text-accent"
      [attr.aria-label]="'Clear track filter ' + (f.specFilterName() ?? '')"
      (click)="f.toggleSpec(specId)"
    >
      {{ f.specFilterName() }} only
      <ap-icon name="x" [size]="14" [strokeWidth]="2.5" />
    </button>
  }
</ap-page-header>

<ap-health-kpis [kpis]="f.kpis()" [active]="f.focus()" (kpiToggle)="f.toggleFocus($event)" />

<div class="mt-8 grid gap-6 lg:grid-cols-5 lg:gap-7">
  <div class="lg:col-span-3">
    <ap-risk-radar
      [entries]="f.radar()"
      [heading]="f.radarTitle()"
      [focus]="f.focus()"
      [blockers]="f.blockers()"
      [viewAll]="f.radarViewAll()"
      (openPassport)="f.openPassport($event)"
      (clearFocus)="f.focus.set(null)"
    />
  </div>
  <div class="lg:col-span-2">
    <ap-standouts-card [entries]="f.standouts()" (openPassport)="f.openPassport($event)" />
  </div>
</div>

<div class="mt-10">
  <ap-spec-health-matrix [rows]="f.specMatrix()" [active]="f.specFilter()" (specToggle)="f.toggleSpec($event)" />
</div>

@if (f.showSprints()) {
  <div class="mt-8">
    <ap-sprint-table
      [rows]="f.sprintRows()"
      [sprintNumbers]="f.sprintNumbers"
      [columnAverages]="f.sprintColumnAverages()"
      [canLog]="f.canLogSprint()"
      (openPassport)="f.openPassport($event)"
      (logMark)="sprintDialogOpen.set(true)"
    />
  </div>
}

<ap-apprentice-passport [passport]="f.passport()" (closed)="f.closePassport()" (copyBrief)="copyBrief()" />

@if (f.canLogSprint()) {
  <ap-sprint-mark-dialog
    [open]="sprintDialogOpen()"
    [candidates]="f.sprintCandidates()"
    (submitted)="saveSprint($event)"
    (closed)="sprintDialogOpen.set(false)"
  />
}
