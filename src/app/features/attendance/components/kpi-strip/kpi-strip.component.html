<ul class="grid grid-cols-2 gap-2.5 lg:grid-cols-4 lg:gap-3" aria-label="Key figures — tap a card to rank or filter">
  @for (t of tiles(); track t.key) {
    <li>
      <button
        type="button"
        class="glass flex h-full w-full flex-col rounded-2xl border p-4 text-left transition-[box-shadow,transform] active:scale-[0.99]"
        [class.ring-2]="active() === t.key"
        [class.ring-accent]="active() === t.key"
        [attr.aria-pressed]="active() === t.key"
        [title]="t.hint"
        (click)="kpiToggle.emit(t.key)"
      >
        <span class="text-xs font-semibold text-fg-muted">{{ t.label }}</span>
        <span class="mt-1.5 font-display text-[1.75rem] font-semibold leading-none tabular-nums" aria-live="polite">
          @if (!kpis().hasData && t.kind === 'rate') {
            —
          } @else if (t.kind === 'rate') {
            {{ t.kpi.value | percent: '1.0-1' }}
          } @else {
            {{ t.kpi.value }}
          }
        </span>
        <span class="mt-2 flex items-center gap-1 text-[11px] font-medium" [class]="deltaTone(t)">
          @if (deltaIcon(t); as icon) {
            <ap-icon [name]="icon" [size]="13" />
          }
          {{ deltaText(t) }}
          @if (t.kpi.delta !== null) {
            <span class="truncate font-normal text-fg-subtle">{{ priorLabel() }}</span>
          }
        </span>
        <span class="mt-1 text-[11px] font-semibold" [class]="active() === t.key ? 'text-accent' : 'text-fg-subtle'">
          {{ actionHint(t) }}
        </span>
      </button>
    </li>
  }
</ul>
