<div
  class="relative flex items-stretch overflow-hidden rounded-2xl border bg-surface shadow-[var(--shadow-card)] transition-[box-shadow,border-color,opacity] duration-200"
  [class.border-line]="!entry().revealing"
  [class.border-transparent]="entry().revealing"
  [class.ring-2]="entry().revealing"
  [class]="entry().revealing && tone() ? tone()!.ring + ' card-pop' : ''"
  [class.opacity-60]="disabled()"
>
  <span class="absolute inset-y-0 left-0 w-1" [style.background-color]="stripe()" aria-hidden="true"></span>

  <button
    type="button"
    data-sweep-card
    class="flex min-h-[4.25rem] min-w-0 flex-1 select-none items-center gap-3 py-2.5 pl-4 pr-1 text-left transition-colors hover:bg-surface-2/50 active:bg-surface-2 disabled:cursor-not-allowed"
    apLongPress
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    aria-keyshortcuts="P L A E D"
    (apLongPress)="details.emit()"
    (click)="onClick($event)"
    (keydown)="onKey($event)"
  >
    <span class="relative shrink-0">
      <ap-avatar [name]="entry().name" [seed]="entry().id" [src]="entry().apprentice.avatarUrl" [size]="44" />
      @if (entry().revealing && tone(); as t) {
        <span
          class="badge-pop absolute -bottom-1 -right-1 grid size-5 place-items-center rounded-full ring-2 ring-surface"
          [class]="t.solid"
          aria-hidden="true"
        >
          <ap-icon name="check" [size]="12" [strokeWidth]="3" />
        </span>
      }
    </span>

    <span class="min-w-0 flex-1">
      <span class="block truncate text-[0.9375rem] font-semibold leading-snug">{{ entry().name }}</span>
      <span class="mt-0.5 flex min-w-0 items-center gap-1 text-xs text-fg-muted">
        @for (f of flags(); track f.key) {
          <span
            class="inline-flex shrink-0 items-center gap-1 rounded-full px-1.5 py-px text-[10px] font-semibold leading-4 ring-1 ring-inset"
            [class]="f.tone"
            [title]="f.description"
            aria-hidden="true"
          >
            <ap-icon [name]="f.key === 'late' ? 'clock' : 'alert'" [size]="10" [strokeWidth]="2.5" />{{ f.label }}
          </span>
        }
        @if (entry().mark?.note) {
          <ap-icon name="note" [size]="12" class="shrink-0" />
        }
        <span class="truncate">{{ subtitle() }}</span>
      </span>
    </span>

    @if (entry().mark; as mark) {
      <span
        class="grid size-8 shrink-0 place-items-center rounded-lg font-display text-sm font-semibold"
        [class]="entry().revealing ? tone()!.solid : tone()!.soft"
        aria-hidden="true"
        >{{ mark.status }}</span
      >
    }
  </button>

  <button
    type="button"
    class="grid w-11 shrink-0 place-items-center text-fg-subtle transition-colors hover:bg-surface-2 hover:text-fg disabled:cursor-not-allowed"
    [disabled]="disabled()"
    [attr.aria-label]="'Status, reason and note for ' + entry().name"
    (click)="details.emit()"
  >
    <ap-icon name="more-horizontal" [size]="20" />
  </button>
</div>
