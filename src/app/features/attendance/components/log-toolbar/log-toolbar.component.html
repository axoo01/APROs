<div class="flex flex-col gap-3 lg:flex-row lg:items-center">
  <div role="radiogroup" aria-label="Time scope" class="grid grid-cols-4 rounded-xl border border-line bg-surface-2/60 p-1 lg:inline-grid">
    @for (p of presets; track p.value) {
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="preset() === p.value"
        class="min-h-10 rounded-lg px-2 text-sm font-medium transition-colors sm:px-4"
        [class]="preset() === p.value ? 'bg-surface text-fg shadow-sm' : 'text-fg-muted hover:text-fg'"
        (click)="presetChange.emit(p.value)"
      >
        <span class="sm:hidden">{{ p.short }}</span><span class="hidden sm:inline">{{ p.label }}</span>
      </button>
    }
  </div>

  @if (preset() === 'DAY') {
    <div class="flex items-center gap-1.5 [animation:fade-up_180ms_var(--ease-out-quart)]">
      <button
        type="button"
        class="btn btn-secondary size-11 shrink-0 px-0"
        aria-label="Previous working day"
        [disabled]="day() <= minDay()"
        (click)="step.emit(-1)"
      >
        <ap-icon name="chevron-right" [size]="18" class="rotate-180" />
      </button>
      <label class="min-w-0 flex-1 lg:flex-none">
        <span class="sr-only">Day</span>
        <input
          type="date"
          class="field lg:w-48"
          [value]="day()"
          [min]="minDay()"
          [max]="maxDay()"
          (change)="onDate($event)"
        />
      </label>
      <button
        type="button"
        class="btn btn-secondary size-11 shrink-0 px-0"
        aria-label="Next working day"
        [disabled]="day() >= maxDay()"
        (click)="step.emit(1)"
      >
        <ap-icon name="chevron-right" [size]="18" />
      </button>
    </div>
  }

  @if (canExport()) {
    <button type="button" class="btn btn-secondary lg:ml-auto" [disabled]="exportDisabled()" (click)="export.emit()">
      <ap-icon name="download" [size]="16" /> Export CSV
    </button>
  }
</div>
